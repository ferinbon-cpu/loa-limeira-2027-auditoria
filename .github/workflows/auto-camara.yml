name: LOA Limeira - coleta autonoma de metadados

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/auto-camara.yml"
      - "scripts/**"
      - "tests/**"
  schedule:
    - cron: "17 2,8,14,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: loa-limeira-2027-coleta-incremental
  cancel-in-progress: false

jobs:
  coleta-incremental:
    name: Coletar ate 25 paginas publicas e registrar progresso
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout da branch principal
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Testar controles de acesso e fila - sem rede
        run: python3 -m unittest discover -s tests -v

      - name: Avancar fila em lotes incrementais, ate 15 x 25 paginas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run_logs
          for lote in $(seq 1 15); do
            echo "Lote ${lote}/15 — no maximo 25 paginas; sem PDFs"
            python3 scripts/auto_camara.py --outdir data/publico --limit 25
            cp data/publico/ULTIMA_RODADA.json "run_logs/lote_${lote}.json"
            acessos=$(python3 -c 'import json; print(json.load(open("data/publico/ULTIMA_RODADA.json", encoding="utf-8"))["acessos_realizados"])')
            if [ "${acessos}" -eq 0 ]; then
              echo "Fila concluida, em espera ou sob pausa global: STOP"
              break
            fi
            if python3 -c 'import json,datetime; s=json.load(open("data/publico/estado.json",encoding="utf-8")); q=s.get("pause_until",""); exit(0 if q and datetime.datetime.fromisoformat(q)>datetime.datetime.now(datetime.timezone.utc) else 1)'; then
              echo "Portal sinalizou limite HTTP 429: STOP e aguardar 24 horas"
              break
            fi
          done

      - name: Publicar resumo desta execucao
        if: always()
        shell: bash
        run: |
          if test -f data/publico/STATUS.md; then
            cat data/publico/STATUS.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Sem relatorio gerado; verificar logs de erro." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Salvar automaticamente estado e links publicos no repositorio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publico/estado.json data/publico/paginas.csv data/publico/links_publicos.csv data/publico/STATUS.md data/publico/ULTIMA_RODADA.json
          if git diff --cached --quiet; then
            echo "Sem alteracoes no inventario."
          else
            git commit -m "data: atualizar inventario publico LOA 2027 [skip ci]"
            git push origin HEAD:main
          fi

      - name: Disponibilizar artefato para auditoria e cotejo com Drive SME
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loa-2027-metadados-publicos
          path: |
            data/publico/
            run_logs/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
